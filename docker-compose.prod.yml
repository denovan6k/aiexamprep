# Production / Dokploy Compose stack.
# Set secrets and URLs in Dokploy Environment (writes .env next to this file).
# Local: docker compose -f docker-compose.prod.yml --env-file .env up --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knorvex}
      POSTGRES_USER: ${POSTGRES_USER:-knorvex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - knorvex_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knorvex} -d ${POSTGRES_DB:-knorvex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - knorvex

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - knorvex_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - knorvex

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-knorvex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-knorvex}
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - knorvex

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["arq", "app.workers.settings.WorkerSettings"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-knorvex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-knorvex}
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /app
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - knorvex

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - knorvex

  docs:
    build:
      context: .
      dockerfile: documentation/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - knorvex

volumes:
  knorvex_postgres_data:
  knorvex_redis_data:

networks:
  knorvex:
    driver: bridge
