[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knorvex-api"
version = "0.1.0"
description = "FastAPI backend for Knorvex."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "boto3>=1.35.0",
  "arq>=0.26.0",
  "cloudinary>=1.41.0",
  "firecrawl-anydoc>=0.1.0",
  "cryptography>=43.0.0",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.6.0",
  "psycopg[binary]>=3.2.0",
  "openai>=1.57.0",
  "pypdf>=5.1.0",
  "pymupdf>=1.24.0",
  "content-core>=1.14.1,<2",
  "python-docx>=1.1.2",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "jinja2>=3.1.0",
  "headroom-ai>=0.21.0",
  "redis>=5.2.0",
  "sqlalchemy>=2.0.0",
  "stripe>=11.0.0",
  "firecrawl-anydoc>=0.1.0",
  "uvicorn[standard]>=0.32.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
